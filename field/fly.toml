# Fly.io config for the hosted field demo (field app, FastAPI).
# "rescue-field-demo" is a PLACEHOLDER app name: replace it (or let `fly launch --copy-config --no-deploy` rename it)
# before deploying. Deploy steps: RUNBOOK.md, section "Deploy hosted field demo to Fly".
# Run fly from the REPO ROOT: the image builds from the root (docker build -f field/Dockerfile .).
# Secrets (never in this file): DEVICE_TOKEN, CLOUD_URL.

app = "rescue-field-demo"
primary_region = "iad"
kill_signal = "SIGTERM"

[build]
# flyctl resolves this path relative to THIS file's folder (the build context is still the repo root
# passed as `fly deploy .`), so it is just "Dockerfile". With "field/Dockerfile" current flyctl looks for field/field/Dockerfile.
  dockerfile = "Dockerfile"

# Bake in the pinned model (gated repo; pass the token with --build-secret HF_TOKEN=..., see RUNBOOK.md).
# Interim pin (#104, 2026-11-07 16:07Z): v3, pinned at Paawan's request (scores below laya-s13 on the draft
# evals, see docs/DECISIONS.md). A later checkpoint is a revision swap here and in docs/DECISIONS.md.
[build.args]
  HF_REPO = "paawandesai/rescue-tagger"
  HF_REVISION = "7279106609ccfc2a7953636d4c34bb9524179fd7"

[env]
  PORT = "8080"
  DEMO_MODE = "1"
  ECC_NAME = "ECC 1"
  VOLUNTEER_ROLE = "Volunteer"
  DEVICE_ID = "demo-field-01"
  INCIDENT_PREFIX = "A"
  FIELD_DATA_DIR = "/data"

# Measured 2026-11-07: the image with CPU torch and a tiny checkpoint in the trainer layout uses ~630 MB;
# mmBERT-base adds ~1.3 GB of fp32 weights plus activations, so 2 GB is too tight.
[[vm]]
  memory = "4gb"
  cpus = 2
  cpu_kind = "shared"

[mounts]
  source = "field_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Demo: keep the single machine running (SQLite lives on the volume).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # /healthz answers without the intake lock or the database (review M-04, O-02): a large board
  # render or a bulk upload must not fail the check. /sync/status still reports sync state.
  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"
