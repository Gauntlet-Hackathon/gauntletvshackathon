# Fly.io config for the hosted field demo (field app, FastAPI).
# "rescue-field-demo" is a PLACEHOLDER app name: replace it (or let `fly launch --copy-config --no-deploy` rename it)
# before deploying. Deploy steps: RUNBOOK.md, section "Deploy hosted field demo to Fly".
# Run fly from the REPO ROOT: the image builds from the root (docker build -f field/Dockerfile .).
# Secrets (never in this file): DEVICE_TOKEN, CLOUD_URL.

app = "rescue-field-demo"
primary_region = "iad"
kill_signal = "SIGTERM"

[build]
  dockerfile = "field/Dockerfile"
  # Bake in the pinned model (gated repo; pass the token with --build-secret HF_TOKEN=..., see RUNBOOK.md):
  # [build.args]
  #   HF_REPO = "<org>/<model>"
  #   HF_REVISION = "<40-hex commit sha>"

[env]
  PORT = "8080"
  DEMO_MODE = "1"
  DEVICE_ID = "demo-field-01"
  FIELD_DATA_DIR = "/data"

# Measured 2026-11-07: the image with CPU torch and a tiny checkpoint in the trainer layout uses ~630 MB;
# mmBERT-base adds ~1.3 GB of fp32 weights plus activations, so 2 GB is too tight.
[[vm]]
  memory = "4gb"
  cpus = 2
  cpu_kind = "shared"

[mounts]
  source = "field_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Demo: keep the single machine running (SQLite lives on the volume).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/sync/status"
