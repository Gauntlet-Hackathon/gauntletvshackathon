<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rescue triage board</title>
<style>
html { font-size: 18px; }
body { font-family: system-ui, sans-serif; margin: 1rem auto; max-width: 96rem; padding: 0 1rem; color: #111; background: #fff; }
.skip-link { position: absolute; left: -999px; top: 0; background: #fff; color: #00366b; padding: .5rem 1rem; z-index: 10; }
.skip-link:focus { left: 0; }
:focus-visible { outline: 3px solid #0b57d0; outline-offset: 2px; }
.tier-P1 h2 { color: #b00020; } .tier-P2 h2 { color: #8a5200; } .tier-P3 h2 { color: #1b5e20; }
.provisional-tier { font-weight: bold; }
.row { border: 1px solid #767676; border-radius: 4px; margin: .4rem 0; padding: .4rem .6rem; }
.meta { color: #4d4d4d; font-size: 1rem; }
.dups { margin: .3rem 0 0 1rem; font-size: 1rem; }
table { border-collapse: collapse; } td, th { padding: .1rem .6rem .1rem 0; text-align: left; }
.badge { display: inline-block; padding: .15rem .6rem; border-radius: 1rem; font-size: 1rem; color: #111; }
#intake-error, #status-error, #offline-toggle-msg { color: #b00020; } #intake form { margin: .6rem 0; }
.badge-online { background: #c8e6c9; } .badge-offline { background: #ffcdd2; } .badge-nosync { background: #e0e0e0; }
</style>
</head>
<body>
<a class="skip-link" href="#board">Skip to board</a>
<header>
<h1>Rescue triage board</h1>
<div id="sync-badge" role="status" aria-live="polite"></div>
{% if demo_mode %}<p><button type="button" id="offline-toggle">Simulate offline</button> <span id="offline-toggle-msg" role="alert"></span></p>
{% endif %}
</header>
<main id="main">
{% include "_intake.html" %}
<p id="status-error" role="alert"></p>
<div id="board" tabindex="-1">{% include "_board.html" %}</div>
</main>
<script>
async function refreshBadge() {
  try {
    const r = await fetch("/sync/badge");
    if (!r.ok) throw new Error("HTTP " + r.status);
    document.getElementById("sync-badge").innerHTML = await r.text();
  } catch (e) {
    document.getElementById("sync-badge").textContent = "Sync status unavailable";
  }
}
async function toggleOffline() {
  const btn = document.getElementById("offline-toggle");
  const msg = document.getElementById("offline-toggle-msg");
  msg.textContent = "";
  btn.disabled = true;
  try {
    const r = await fetch("/sync/offline-toggle", {method: "POST"});
    let body = null;
    try { body = await r.json(); } catch (e) {}
    if (!r.ok) {
      msg.textContent = (body && (body.detail || body.error)) || ("Toggle failed (HTTP " + r.status + ")");
      return;
    }
    btn.textContent = body.paused ? "Go back online" : "Simulate offline";
    await refreshBadge();
    const b = await fetch("/", {headers: {"HX-Request": "true"}});
    if (b.ok) document.getElementById("board").innerHTML = await b.text();
  } catch (e) {
    msg.textContent = "Error: " + e.message;
  } finally {
    btn.disabled = false;
  }
}
const toggleBtn = document.getElementById("offline-toggle");
if (toggleBtn) toggleBtn.addEventListener("click", toggleOffline);

function lineCount(form) {
  if (form.dataset.kind === "paste") return form.elements.text.value.split("\n").filter(l => l.trim()).length;
  if (form.dataset.kind === "single") return 1;
  return null;
}
async function submitIntake(ev) {
  ev.preventDefault();
  const form = ev.target, btn = form.querySelector("button[type=submit]");
  const status = document.getElementById("intake-status"), err = document.getElementById("intake-error");
  const n = lineCount(form);
  err.textContent = ""; btn.disabled = true;
  status.textContent = n === null ? "Processing requests\u2026" : "Processing " + n + " request" + (n === 1 ? "" : "s") + "\u2026";
  try {
    let resp;
    if (form.dataset.kind === "single") {
      resp = await fetch(form.action, {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(Object.fromEntries([...new FormData(form)].filter(([k, v]) => k === "raw_text" || v)))});
    } else if (form.dataset.kind === "paste") {
      resp = await fetch(form.action, {method: "POST", headers: {"Content-Type": "text/plain"}, body: form.elements.text.value});
    } else {
      resp = await fetch(form.action, {method: "POST", body: new FormData(form)});
    }
    let body = null;
    try { body = await resp.json(); } catch (e) {}
    if (!resp.ok) {
      status.textContent = "";
      let msg = (body && (body.detail || body.error)) || ("Request failed (HTTP " + resp.status + ")");
      if (body && body.row != null) msg += " (row " + body.row + ")";
      err.textContent = msg;
      return;
    }
    const added = body && body.count != null ? body.count : 1;
    status.textContent = "Added " + added + " request" + (added === 1 ? "" : "s");
    form.reset();
    const r = await fetch("/", {headers: {"HX-Request": "true"}});
    if (!r.ok) throw new Error("board refresh failed (HTTP " + r.status + ")");
    document.getElementById("board").innerHTML = await r.text();
  } catch (e) {
    status.textContent = "";
    err.textContent = "Error: " + e.message;
  } finally {
    btn.disabled = false;
  }
}
document.querySelectorAll("#intake form").forEach(f => f.addEventListener("submit", submitIntake));
async function submitStatus(ev) {
  const form = ev.target.closest("form.status-form");
  if (!form) return;
  ev.preventDefault();
  const btn = ev.submitter;
  if (!btn || btn.disabled) return;
  const err = document.getElementById("status-error");
  const status = btn.value, body = {status};
  const field = {assigned: "crew", escalated: "reason", rescued: "rescued_count"}[status];
  const val = form.elements[field].value.trim();
  if (field === "rescued_count") { if (val !== "") body[field] = Number(val); } else body[field] = val;
  err.textContent = "";
  btn.disabled = true;
  try {
    const resp = await fetch("/requests/" + encodeURIComponent(form.dataset.requestId) + "/status",
      {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    let data = null;
    try { data = await resp.json(); } catch (e) {}
    if (!resp.ok) {
      err.textContent = (data && (data.detail || data.error)) || ("Request failed (HTTP " + resp.status + ")");
      btn.disabled = false;  // keep what the user typed; no re-render
      return;
    }
    const r = await fetch("/", {headers: {"HX-Request": "true"}});
    if (!r.ok) throw new Error("board refresh failed (HTTP " + r.status + ")");
    document.getElementById("board").innerHTML = await r.text();
  } catch (e) {
    err.textContent = "Error: " + e.message;
    btn.disabled = false;
  }
}
document.getElementById("board").addEventListener("submit", submitStatus);
refreshBadge(); setInterval(refreshBadge, 2000);
</script>
</body>
</html>
