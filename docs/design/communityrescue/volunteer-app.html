<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CommunityRescue</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B57D0}a:hover{color:#0842A0}
button:focus-visible{outline:3px solid #0B57D0;outline-offset:2px}
</style>
<style>
html,body{height:100%;margin:0;background:#E9EBEF}
.stage{height:100vh;height:100dvh;display:flex;justify-content:center}
.phone{width:100%;max-width:560px;height:100%;background:#F6F7F9;border-left:1px solid #D0D5DD;border-right:1px solid #D0D5DD}
@media (max-width: 560px){.phone{border:0}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="app"></div>
</div>
<script>
/* Minimal runtime for this prototype: renders the template's {{holes}}, <sc-if> and <sc-for>, and re-renders on setState. */
(function () {
  var TEMPLATE = `<div style="width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #F6F7F9; color: #111418; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif">

<header style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; padding: 10px 16px 10px; background: #FFFFFF; border-bottom: 1px solid #D0D5DD">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%201024%201024%22%20width%3D%221024%22%20height%3D%221024%22%20role%3D%22img%22%20aria-label%3D%22CommunityRescue%22%3E%0A%20%20%3Crect%20width%3D%221024%22%20height%3D%221024%22%20rx%3D%22228%22%20fill%3D%22%230B57D0%22/%3E%0A%20%20%3Cpath%20d%3D%22M262%20404%20L512%20196%20L762%20404%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2264%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%0A%20%20%3Ccircle%20cx%3D%22512%22%20cy%3D%22552%22%20r%3D%22168%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2292%22/%3E%0A%20%20%3Ccircle%20cx%3D%22512%22%20cy%3D%22552%22%20r%3D%22168%22%20fill%3D%22none%22%20stroke%3D%22%23F59E0B%22%20stroke-width%3D%2292%22%20stroke-dasharray%3D%22104%20159.9%22%20stroke-dashoffset%3D%2252%22%20transform%3D%22rotate%28-45%20512%20552%29%22/%3E%0A%20%20%3Cpath%20d%3D%22M150%20790%20q90%20-62%20181%200%20t181%200%20t181%200%20t181%200%22%20fill%3D%22none%22%20stroke%3D%22%230B57D0%22%20stroke-width%3D%22120%22%20stroke-linecap%3D%22round%22/%3E%0A%20%20%3Cpath%20d%3D%22M150%20790%20q90%20-62%20181%200%20t181%200%20t181%200%20t181%200%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2252%22%20stroke-linecap%3D%22round%22/%3E%0A%3C/svg%3E%0A" alt="" width="32" height="32" style="width: 32px; height: 32px; display: block">CommunityRescue</span>
<button type="button" aria-label="Signed in as Jordan K., volunteer with the [ECC NAME] Emergency Control Center. Open account menu" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 2px 0 0; border: 0; background: transparent; color: #111418; font: 700 15px 'Atkinson Hyperlegible', system-ui, sans-serif; cursor: pointer; text-align: left"><span aria-hidden="true" style="flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 16px; background: #EEF3FD; color: #0A3A8C; font-size: 13px; font-weight: 700">JK</span><span style="display: flex; flex-direction: column; line-height: 1.2"><span>Jordan K.</span><span style="font-size: 12px; font-weight: 400; color: #4A5260">Volunteer</span><span style="font-size: 12px; font-weight: 400; color: #4A5260">[ECC NAME] ECC</span></span></button>
</div>
<div role="radiogroup" aria-label="Jordan is" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #E9EBEF; border-radius: 12px; padding: 4px">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{r.checked}}" onClick="{{r.pick}}" style="{{r.style}}">{{r.label}}</button>
</sc-for>
</div>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #4A5260"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="#F59E0B"></circle></svg>No Internet: Local Store, Sync when online</span>
</header>

<div style="flex: 1 1 auto; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">

<sc-if value="{{isNext}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
<div role="status" style="display: flex; gap: 10px; align-items: flex-start; background: #E7F3E8; color: #0F3D13; border-radius: 12px; padding: 12px 14px; font-size: 16px">
<span style="flex: 1 1 auto">{{toast}}</span>
<button type="button" onClick="{{clearToast}}" aria-label="Dismiss" style="min-width: 44px; min-height: 44px; border: 0; background: transparent; color: #0F3D13; font-size: 22px; cursor: pointer">×</button>
</div>
</sc-if>
<p style="margin: 0; font-size: 16px; color: #4A5260">{{summary}}</p>

<sc-if value="{{hasCur}}" hint-placeholder-val="{{true}}">
<article style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
<span style="{{cur.pillStyle}}">{{cur.levelLabel}}</span>
<span aria-label="{{cur.incLabel}}" style="display: inline-block; padding: 3px 9px; border: 2px solid #111418; border-radius: 6px; background: #FFFFFF; color: #111418; font-size: 15px; font-weight: 700; letter-spacing: 0.04em">{{cur.inc}}</span>
</div>
<h1 style="margin: 0; font-size: 26px; line-height: 1.2; font-weight: 700">{{cur.headline}}</h1>
<div style="display: flex; flex-direction: column; gap: 2px; background: #E7F3E8; border-radius: 10px; padding: 10px 12px">
<span style="font-size: 19px; font-weight: 700">{{cur.place}}</span>
<span style="font-size: 16px; color: #4A5260">{{cur.landmark}}</span>
</div>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 17px; line-height: 1.35">
<sc-for list="{{cur.details}}" as="d" hint-placeholder-count="3"><li>{{d.t}}</li></sc-for>
</ul>
<div style="background: #F6F7F9; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; font-size: 15px">
<span style="font-weight: 700">{{cur.contact}}</span>
<span style="color: #4A5260">{{cur.heard}}</span>
</div>
<button type="button" onClick="{{toggleWhy}}" aria-expanded="{{whyOpen}}" style="align-self: flex-start; min-height: 44px; padding: 0; border: 0; background: transparent; color: #0B57D0; font: 700 16px 'Atkinson Hyperlegible', system-ui, sans-serif; text-decoration: underline; cursor: pointer">{{whyLabel}}</button>
<sc-if value="{{showWhy}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-size: 16px; line-height: 1.4; background: #EEF3FD; border-radius: 10px; padding: 10px 12px">{{cur.why}}</p>
</sc-if>
<nav aria-label="Queue views" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; border-top: 1px solid #E4E7EC; padding-top: 12px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="3">
<button type="button" onClick="{{n.go}}" aria-current="{{n.current}}" style="{{n.style}}">{{n.label}}</button>
</sc-for>
</nav>
</article>
<button type="button" onClick="{{primary}}" style="min-height: 60px; border: 0; border-radius: 14px; background: #0B57D0; color: #FFFFFF; font: 700 20px 'Atkinson Hyperlegible', system-ui, sans-serif; cursor: pointer">{{cur.primaryLabel}}</button>
<button type="button" onClick="{{secondary}}" style="min-height: 56px; border: 2px solid #0B57D0; border-radius: 14px; background: #FFFFFF; color: #0B57D0; font: 700 18px 'Atkinson Hyperlegible', system-ui, sans-serif; cursor: pointer">{{cur.secondaryLabel}}</button>
<button type="button" onClick="{{skip}}" style="min-height: 44px; border: 0; background: transparent; color: #4A5260; font: 400 16px 'Atkinson Hyperlegible', system-ui, sans-serif; text-decoration: underline; cursor: pointer">Skip for now, show the next person</button>
</sc-if>
<sc-if value="{{noCur}}" hint-placeholder-val="{{false}}">
<div style="background: #FFFFFF; border-radius: 16px; padding: 24px; font-size: 19px; text-align: center">Nobody is waiting right now.</div>
<nav aria-label="Queue views" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="3">
<button type="button" onClick="{{n.go}}" aria-current="{{n.current}}" style="{{n.style}}">{{n.label}}</button>
</sc-for>
</nav>
</sc-if>
</div>
</sc-if>

<sc-if value="{{isSend}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 12px">
<button type="button" onClick="{{goNext}}" style="align-self: flex-start; min-height: 44px; border: 0; background: transparent; color: #0B57D0; font: 700 16px 'Atkinson Hyperlegible', system-ui, sans-serif; cursor: pointer; padding: 0">‹ Back</button>
<h1 style="margin: 0; font-size: 24px; font-weight: 700">Who can go to {{cur.place}}?</h1>
<p style="margin: 0; font-size: 16px; color: #4A5260">They need room for {{cur.people}} people.</p>
<sc-for list="{{helpers}}" as="h" hint-placeholder-count="3">
<button type="button" onClick="{{h.pick}}" aria-pressed="{{h.pressed}}" style="{{h.style}}">
<span style="font-size: 19px; font-weight: 700">{{h.name}}</span>
<span style="font-size: 15px; color: #4A5260">{{h.status}}</span>
<span style="{{h.fitStyle}}">{{h.fit}}</span>
</button>
</sc-for>
<sc-if value="{{hasHelper}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 4px 0 0; font-size: 18px; font-weight: 700">Tell {{helperShort}} (radio or text)</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.45; background: #111418; color: #FFFFFF; border-radius: 12px; padding: 14px">{{message}}</p>
<button type="button" style="min-height: 52px; border: 2px solid #111418; border-radius: 14px; background: #FFFFFF; color: #111418; font: 700 17px 'Atkinson Hyperlegible', system-ui, sans-serif; cursor: pointer">Copy message</button>
<button type="button" onClick="{{confirmSend}}" style="min-height: 60px; border: 0; border-radius: 14px; background: #0B57D0; color: #FFFFFF; font: 700 20px 'Atkinson Hyperlegible', system-ui, sans-serif; cursor: pointer">{{helperShort}} is on the way</button>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{isSent}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px; padding-top: 24px">
<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#1B5E20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M7.5 12.5l3 3 6-6.5"></path></svg>
<h1 style="margin: 0; font-size: 26px; font-weight: 700">{{lastSent.helper}} is on the way to {{lastSent.place}}</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.4">If {{lastSent.helper}} hasn’t checked in within 20 minutes, this screen will remind you to call.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.4; color: #4A5260">When they’re back, open <strong>Out now</strong> and tell us how it went.</p>
<button type="button" onClick="{{goNext}}" style="min-height: 60px; border: 0; border-radius: 14px; background: #0B57D0; color: #FFFFFF; font: 700 20px 'Atkinson Hyperlegible', system-ui, sans-serif; cursor: pointer">Next person</button>
</div>
</sc-if>

<sc-if value="{{isAsk}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 12px">
<button type="button" onClick="{{goNext}}" style="align-self: flex-start; min-height: 44px; border: 0; background: transparent; color: #0B57D0; font: 700 16px 'Atkinson Hyperlegible', system-ui, sans-serif; cursor: pointer; padding: 0">‹ Back</button>
<h1 style="margin: 0; font-size: 24px; font-weight: 700">Ask before anyone goes</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.4">{{cur.askWhy}}</p>
<span style="font-size: 15px; font-weight: 700; color: #4A5260">Call or text {{cur.contact}}</span>
<p style="margin: 0; font-size: 18px; line-height: 1.45; background: #111418; color: #FFFFFF; border-radius: 12px; padding: 14px">{{cur.ask}}</p>
<button type="button" style="min-height: 52px; border: 2px solid #111418; border-radius: 14px; background: #FFFFFF; color: #111418; font: 700 17px 'Atkinson Hyperlegible', system-ui, sans-serif; cursor: pointer">Copy message</button>
<button type="button" onClick="{{markAsked}}" style="min-height: 60px; border: 0; border-radius: 14px; background: #0B57D0; color: #FFFFFF; font: 700 19px 'Atkinson Hyperlegible', system-ui, sans-serif; cursor: pointer">I asked, show me the next person</button>
</div>
</sc-if>

<sc-if value="{{isList}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<nav aria-label="Queue views" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="3">
<button type="button" onClick="{{n.go}}" aria-current="{{n.current}}" style="{{n.style}}">{{n.label}}</button>
</sc-for>
</nav>
<h1 style="margin: 0; font-size: 24px; font-weight: 700">Waiting for help</h1>
<p style="margin: 0; font-size: 15px; color: #4A5260">Most urgent first. Tap one to open it.</p>
<sc-for list="{{waitingRows}}" as="w" hint-placeholder-count="3">
<button type="button" onClick="{{w.open}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; width: 100%; min-height: 84px; padding: 14px; border: 1px solid #D0D5DD; border-radius: 14px; background: #FFFFFF; color: #111418; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; cursor: pointer">
<span style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap"><span style="{{w.pillStyle}}">{{w.levelLabel}}</span><span aria-label="{{w.incLabel}}" style="display: inline-block; padding: 2px 8px; border: 2px solid #111418; border-radius: 6px; background: #FFFFFF; color: #111418; font-size: 14px; font-weight: 700; letter-spacing: 0.04em">{{w.inc}}</span></span>
<span style="font-size: 18px; font-weight: 700">{{w.headline}}</span>
<span style="font-size: 15px; color: #4A5260">{{w.place}} · {{w.people}} people</span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isOut}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<nav aria-label="Queue views" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="3">
<button type="button" onClick="{{n.go}}" aria-current="{{n.current}}" style="{{n.style}}">{{n.label}}</button>
</sc-for>
</nav>
<h1 style="margin: 0; font-size: 24px; font-weight: 700">Out now</h1>
<p style="margin: 0; font-size: 15px; color: #4A5260">When a team calls in, tap Update.</p>
<sc-for list="{{outRows}}" as="o" hint-placeholder-count="2">
<div style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
<span style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap"><span aria-label="{{o.incLabel}}" style="display: inline-block; padding: 2px 8px; border: 2px solid #111418; border-radius: 6px; background: #FFFFFF; color: #111418; font-size: 14px; font-weight: 700; letter-spacing: 0.04em">{{o.inc}}</span><span style="font-size: 18px; font-weight: 700">{{o.helper}} → {{o.place}}</span></span>
<span style="font-size: 15px; color: #4A5260">{{o.since}} · {{o.people}} people</span>
<button type="button" onClick="{{o.update}}" style="min-height: 52px; border: 0; border-radius: 12px; background: #0B57D0; color: #FFFFFF; font: 700 17px 'Atkinson Hyperlegible', system-ui, sans-serif; cursor: pointer">Update: how did it go?</button>
</div>
</sc-for>
<sc-if value="{{noOut}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-size: 17px">No teams out right now.</p>
</sc-if>
</div>
</sc-if>

<sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 12px">
<button type="button" onClick="{{goOut}}" style="align-self: flex-start; min-height: 44px; border: 0; background: transparent; color: #0B57D0; font: 700 16px 'Atkinson Hyperlegible', system-ui, sans-serif; cursor: pointer; padding: 0">‹ Back</button>
<h1 style="margin: 0; font-size: 24px; font-weight: 700">How did it go at {{done.place}}?</h1>
<sc-for list="{{outcomes}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
<sc-if value="{{showCount}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border-radius: 14px; padding: 14px">
<span style="font-size: 17px; font-weight: 700">How many people are safe?</span>
<div style="display: flex; align-items: center; gap: 16px">
<button type="button" onClick="{{minus}}" aria-label="One fewer" style="width: 56px; height: 56px; border: 2px solid #111418; border-radius: 12px; background: #FFFFFF; font-size: 26px; cursor: pointer">−</button>
<span style="font-size: 32px; font-weight: 700; min-width: 40px; text-align: center">{{count}}</span>
<button type="button" onClick="{{plus}}" aria-label="One more" style="width: 56px; height: 56px; border: 2px solid #111418; border-radius: 12px; background: #FFFFFF; font-size: 26px; cursor: pointer">+</button>
</div>
<span style="font-size: 17px; font-weight: 700">Where did they go?</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{dests}}" as="d" hint-placeholder-count="3">
<button type="button" onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="{{d.style}}">{{d.label}}</button>
</sc-for>
</div>
</div>
</sc-if>
<button type="button" onClick="{{saveDone}}" style="min-height: 60px; border: 0; border-radius: 14px; background: #0B57D0; color: #FFFFFF; font: 700 20px 'Atkinson Hyperlegible', system-ui, sans-serif; cursor: pointer">Save</button>
</div>
</sc-if>
<sc-if value="{{rv.isRespond}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">{{rv.headline}}</h1>
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="osm-label" style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #4A5260">Operational Status Messages (OSM)</span>
<span style="font-size: 13px; color: #4A5260">Tap a status to send it to the ECC.</span>
<div role="group" aria-labelledby="osm-label" style="display: flex; gap: 4px">
<sc-for list="{{rv.steps}}" as="st" hint-placeholder-count="4"><button type="button" onClick="{{st.go}}" aria-pressed="{{st.pressed}}" style="{{st.style}}">{{st.label}}</button></sc-for>
</div>
</div>
<sc-if value="{{rv.showJob}}" hint-placeholder-val="{{true}}">
<article style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
<span style="display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: 15px; font-weight: 700; background: #B00020; color: #FFFFFF">Needs help now</span>
<span aria-label="Incident 0147" style="display: inline-block; padding: 3px 9px; border: 2px solid #111418; border-radius: 6px; background: #FFFFFF; color: #111418; font-size: 15px; font-weight: 700; letter-spacing: 0.04em">#0147</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; background: #E7F3E8; border-radius: 10px; padding: 10px 12px">
<span style="font-size: 22px; font-weight: 700">{{rv.job.place}}</span>
<span style="font-size: 16px; color: #4A5260">{{rv.job.landmark}}</span>
</div>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 16px; line-height: 1.35">
<sc-for list="{{rv.job.details}}" as="d" hint-placeholder-count="3"><li>{{d.t}}</li></sc-for>
</ul>
<div style="background: #F6F7F9; border-radius: 10px; padding: 10px 12px; font-size: 15px; font-weight: 700">Call when close: {{rv.job.contact}}</div>
</article>
</sc-if>
<sc-if value="{{rv.idle}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-size: 17px; line-height: 1.4; background: #FFFFFF; border-radius: 14px; padding: 16px">Dispatch will send your next job here. Stay near the launch and keep your radio on.</p>
</sc-if>
<sc-if value="{{rv.showCheck}}" hint-placeholder-val="{{false}}">
<span style="font-size: 15px; color: #4A5260">{{rv.check}}</span>
</sc-if>
<sc-if value="{{rv.showDests}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{rv.dests}}" as="dd" hint-placeholder-count="3"><button type="button" onClick="{{dd.pick}}" aria-pressed="{{dd.pressed}}" style="{{dd.style}}">{{dd.label}}</button></sc-for>
</div>
</sc-if>
<sc-for list="{{rv.actions}}" as="a" hint-placeholder-count="2">
<button type="button" onClick="{{a.go}}" style="{{a.style}}">{{a.label}}</button>
</sc-for>
