# Fly.io config for the cloud app. "rescue-cloud-demo" is a PLACEHOLDER app name:
# `fly launch --no-deploy --copy-config --name <your-app>` rewrites it.
app = "rescue-cloud-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PORT = "8080"
  PHX_HOST = "rescue-cloud-demo.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
